name: Cypress tests in Docker

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '30 20 * * 1-5'   # 02:00 IST Mon–Fri (cron is in UTC)
  workflow_dispatch:
    inputs:
      spec:
        description: 'Optional spec path, e.g. cypress/e2e/login.cy.js'
        required: false
        default: ''

jobs:
  cypress:
    name: Cypress (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge]

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image (with layer cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: cypress-tests:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show images on the runner
        run: docker images

      - name: Run Cypress in Docker
        env:
          SPEC: ${{ inputs.spec }}
        run: |
          SPEC_ARG=""
          if [ -n "$SPEC" ]; then SPEC_ARG="--spec $SPEC"; fi
          docker run --rm \
            --shm-size=2g \
            -v "$PWD/cypress/screenshots:/e2e/cypress/screenshots" \
            -v "$PWD/cypress/videos:/e2e/cypress/videos" \
            cypress-tests:ci \
            --browser ${{ matrix.browser }} \
            --config video=true \
            $SPEC_ARG

      - name: Upload screenshots and videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-${{ matrix.browser }}-run-${{ github.run_number }}
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
          retention-days: 2

  # ---------- NEW: save the tested image to GitHub Container Registry ----------
  publish-image:
    name: Publish test image
    needs: cypress                        # waits for all 3 browsers to pass
    if: github.event_name == 'push'       # only pushes to master, not PRs or nightly
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                     # allows pushing to ghcr.io

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set image name (registry names must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cypress-tests" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha